[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seedr-engine"
version = "0.1.0"
description = "AI service that generates structured seed data for database tables using Claude."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "anthropic>=0.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.24.0",
    "anyio>=4.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/seedr_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
